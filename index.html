<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .login-box {
            background: rgba(255, 182, 193, 0.8); /* Light pink with transparency */
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.5);
            /* backdrop-filter: blur(5px); */ /* Optional blur */
            border: 1px solid rgba(255,182,193,0.3);
            transform: translateY(50px);
            opacity: 0;
            animation: slideIn 0.8s forwards;
            width: 320px;
        }

        @keyframes slideIn {
            to { transform: translateY(0); opacity: 1; }
        }

        .login-box h2 {
            margin: 0 0 30px;
            padding: 0;
            color: #fff;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .input-group {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 10px 0;
            font-size: 16px;
            color: #fff;
            margin-bottom: 30px;
            border: none;
            border-bottom: 1px solid #fff;
            background: transparent;
            outline: none;
        }

        .input-group label {
            position: absolute;
            top: 0;
            left: 0;
            padding: 10px 0;
            font-size: 16px;
            color: #fff;
            pointer-events: none;
            transition: 0.5s;
        }

        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -20px;
            left: 0;
            color: #e73c7e; /* Pink accent */
            font-size: 12px;
        }

        button {
            background: #e73c7e; /* Romantic pink */
            border: none;
            outline: none;
            color: #fff;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            width: 100%;
            transition: 0.3s;
        }

        button:hover {
            background: #fff;
            color: #e73c7e;
            box-shadow: 0 0 10px #fff, 0 0 40px #fff, 0 0 80px #fff;
        }

        .helper-text {
            margin-top: 20px;
            text-align: center;
            color: #fff;
            font-size: 14px;
        }

        .helper-text a {
            color: #e73c7e;
            text-decoration: none;
            transition: 0.3s;
        }

        .helper-text a:hover {
            text-decoration: underline;
        }

        .forgot-password {
            float: right;
            margin-top: -20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <form>
            <div class="input-group">
                <input type="text" name="" required>
                <label>Username</label>
            </div>
            <div class="input-group">
                <input type="password" name="" required>
                <label>Password</label>
            </div>
            <div class="helper-text forgot-password">
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit">Submit</button>
        </form>
        <div class="helper-text">
            Don't have an account? <a href="#">Create one!</a>
        </div>
    </div>
</body>
</html>
